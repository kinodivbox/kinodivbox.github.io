
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>KinoDivBox — Embed Player</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080d18;
      --text: #f5f7fb;
      --muted: #9ba9bf;
      --line: rgba(255,255,255,.12);
      --accent: #ff633d;
      --accent-hover: #ff7958;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 Inter, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button { font: inherit; }

    .embed {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .topbar {
      flex: 0 0 auto;
      min-height: 46px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-bottom: 1px solid var(--line);
      background: #0c1321;
    }

    .brand-mark {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff815b, #e83f20);
      color: white;
      font-size: 15px;
      font-weight: 900;
    }

    .brand {
      font-weight: 750;
      letter-spacing: .2px;
    }

    .brand-sub {
      margin-left: auto;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.1px;
      white-space: nowrap;
    }

    .switcher {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 10px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
      background: #0b1120;
      border-bottom: 1px solid var(--line);
    }

    .switcher[hidden] {
      display: none !important;
    }

    .switch-btn {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 8px;
      background: #141e30;
      color: #dbe4f2;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
    }

    .switch-btn:hover:not(:disabled) {
      background: #202d43;
      border-color: rgba(255,255,255,.32);
    }

    .switch-btn[aria-pressed="true"] {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }

    .switch-btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid white;
      outline-offset: 2px;
    }

    .stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background: #03060c;
      isolation: isolate;
    }

    .video-frame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #03060c;
    }

    /* Собственная кнопка полноэкранного режима для VideoSeeD */
    .fullscreen-control {
      position: absolute;
      z-index: 4;
      top: 10px;
      right: 10px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 8px;
      background: rgba(8,13,24,.92);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }

    .fullscreen-control:hover {
      background: #202d43;
    }

    .fullscreen-control[hidden] {
      display: none !important;
    }

    .stage:fullscreen {
      width: 100vw;
      height: 100vh;
      background: #03060c;
    }

    .stage:fullscreen .video-frame {
      width: 100%;
      height: 100%;
    }

    .stage:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      background: #03060c;
    }

    .state {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 22px;
      text-align: center;
      color: var(--muted);
      background: #03060c;
    }

    .state[hidden] {
      display: none !important;
    }

    .state-icon {
      display: block;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 28px;
    }

    .state-title {
      margin-bottom: 5px;
      color: var(--text);
      font-size: 15px;
      font-weight: 750;
    }

    .state-copy {
      max-width: 440px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .retry {
      margin-top: 14px;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .retry:hover {
      background: var(--accent-hover);
    }

    .retry[hidden] {
      display: none !important;
    }

    .foot {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      min-height: 27px;
      background: #0c1321;
      border-top: 1px solid var(--line);
      color: #7f8ca2;
      font-size: 10px;
    }

    .brand-link {
      flex: 0 0 auto;
      color: #aebbd0;
      text-decoration: none;
    }

    .brand-link:hover {
      color: white;
      text-decoration: underline;
    }

    .foot-status {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 420px) {
      .topbar { padding: 7px 9px; }
      .switcher { padding: 7px; gap: 6px; }

      .switch-btn {
        padding: 6px 10px;
        min-height: 32px;
        font-size: 12px;
      }

      .brand-sub {
        font-size: 9px;
        letter-spacing: .7px;
      }

      .state { padding: 14px; }

      .fullscreen-control {
        top: 7px;
        right: 7px;
        padding: 7px 9px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="embed" aria-label="KinoDivBox встроенный видеоплеер">

    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">K</div>
      <div class="brand">KinoDivBox</div>
      <div class="brand-sub">EMBED PLAYER</div>
    </header>

    <nav id="playerSwitcher"
         class="switcher"
         aria-label="Выбор источника видео"
         hidden>
    </nav>

    <section id="stage" class="stage" aria-live="polite">

      <button id="fullscreenButton"
              class="fullscreen-control"
              type="button"
              hidden>
        ⛶ На весь экран
      </button>

      <div id="state" class="state" role="status">
        <span id="stateIcon" class="state-icon" aria-hidden="true">▶</span>
        <div id="stateTitle" class="state-title">Подготовка плеера</div>
        <div id="stateCopy" class="state-copy">
          Проверяем доступные источники видео…
        </div>
        <button id="retryButton" class="retry" type="button" hidden>
          Повторить
        </button>
      </div>
    </section>

    <footer class="foot">
      <span id="footStatus" class="foot-status">
        KinoDivBox Embed Player
      </span>
      <a class="brand-link"
         href="https://kinodivbox.github.io/"
         target="_blank"
         rel="noopener noreferrer">KinoDivBox</a>
    </footer>

  </main>

  <!-- Вспомогательные скрипты существующих источников -->
  <script src="https://super-puper.che-bur-net.cc/vv2.js"></script>
  <script src="https://allohatv.github.io/insert-player.js"></script>
  <script src="https://kodir2.github.io/actualize.js" async></script>
  <script src="https://hdvb-player.github.io/actualize.js" async></script>
  <script src="https://lmx-pl.github.io/lmx-f.github.io/act.js" async></script>

  <script>
  (() => {
    'use strict';

    const switcher = document.getElementById('playerSwitcher');
    const stage = document.getElementById('stage');
    const state = document.getElementById('state');
    const stateIcon = document.getElementById('stateIcon');
    const stateTitle = document.getElementById('stateTitle');
    const stateCopy = document.getElementById('stateCopy');
    const retryButton = document.getElementById('retryButton');
    const footStatus = document.getElementById('footStatus');
    const fullscreenButton = document.getElementById('fullscreenButton');

    let currentId = '';
    let currentRequest = 0;

    /*
     * Порядок массива определяет порядок кнопок.
     * HDVB всегда третий, даже пока загружается API.
     */
    const providers = [
      {
        name: 'Alloha',
        resolve: id =>
          `https://harald-as.newplayjj.com/?kp=${encodeURIComponent(id)}&token=e7b61f129f4a392ac4bf6726a9dd6a`
      },
      {
        name: 'Collaps',
        resolve: id =>
          `https://api.namy.ws/embed/kp/${encodeURIComponent(id)}`
      },
      {
        name: 'HDVB',
        resolve: async id => {
          const token = '8a22f8e7684404c3815e3ffa940f00a';
          const url =
            `https://apivb.com/api/videos.json?id_kp=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;

          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 7000);

          try {
            const response = await fetch(url, {
              signal: controller.signal,
              mode: 'cors',
              credentials: 'omit'
            });

            if (!response.ok) return null;

            const data = await response.json();

            if (!Array.isArray(data) ||
                !data.length ||
                !data[0].iframe_url) {
              return null;
            }

            return data[0].iframe_url;
          } catch (error) {
            console.warn('[KinoDivBox] HDVB lookup failed:', error);
            return null;
          } finally {
            clearTimeout(timeout);
          }
        }
      },
      {
        name: 'VeoVeo',
        resolve: id =>
          `https://api.rstprgapipt.com/balancer-api/iframe?kp=${encodeURIComponent(id)}&token=eyJhbGciOiJIUzI1NiJ9.eyJ3ZWJTaXRlIjoiODE1IiwiaXNzIjoiYXBpLXdlYm1hc3RlciIsInN1YiI6IjgwMyIsImlhdCI6MTc3ODI2MTE1NywianRpIjoiM2Q5MDk5NjktOTNhOC00MDA0LWEzNDItMmE0NmMxMjUyMjc1Iiwic2NvcGUiOiJETEUifQ.w9ElOwW-i07LD5tX05TGYzgiViDqh8saEWmOwLAzyGU`
      },
      {
        name: 'VideoSeeD',
        resolve: id =>
          `https://tv-2-kinoserial.net/embed_auto/${encodeURIComponent(id)}/?token=6091e1d0bf421f73804d2f0dcc2bf1cf`
      },
      {
        name: 'Kodik',
        resolve: id =>
          `https://kodikplayer.com/find-player?kinopoiskID=${encodeURIComponent(id)}`
      },
      {
        name: 'Трейлер',
        resolve: id =>
          `https://api.atomics.ws/embed/trailer-kp/${encodeURIComponent(id)}`
      }
    ];

    function getIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const raw = (params.get('id') || '').trim();
      return /^\d{1,10}$/.test(raw) ? raw : '';
    }

    function setState(icon, title, copy, showRetry = false) {
      stateIcon.textContent = icon;
      stateTitle.textContent = title;
      stateCopy.textContent = copy;
      retryButton.hidden = !showRetry;
      state.hidden = false;
    }

    function hideState() {
      state.hidden = true;
    }

    function clearPlayer() {
      const oldFrame = stage.querySelector('iframe.video-frame');
      if (oldFrame) oldFrame.remove();
    }

    function safeHttpUrl(value) {
      if (typeof value !== 'string' || !value.trim()) return '';

      try {
        const url = new URL(value, window.location.href);

        if (url.protocol !== 'https:' && url.protocol !== 'http:') {
          return '';
        }

        return url.href;
      } catch (_) {
        return '';
      }
    }

    function showPlayer(src, name, button) {
      const safeSrc = safeHttpUrl(src);

      if (!safeSrc) {
        setState(
          '!',
          'Источник недоступен',
          'Провайдер вернул некорректный адрес. Выберите другой источник.'
        );
        return;
      }

      clearPlayer();

      // Собственная кнопка показывается только для VideoSeeD.
      fullscreenButton.hidden = name !== 'VideoSeeD';

      [...switcher.querySelectorAll('.switch-btn')].forEach(btn => {
        btn.setAttribute('aria-pressed', String(btn === button));
      });

      const frame = document.createElement('iframe');
      frame.className = 'video-frame';
      frame.src = safeSrc;
      frame.title = `Видеоплеер ${name}`;
      frame.loading = 'eager';

      frame.setAttribute(
        'allow',
        'autoplay; fullscreen; picture-in-picture; encrypted-media'
      );
      frame.setAttribute('allowfullscreen', '');
      frame.setAttribute('webkitallowfullscreen', '');
      frame.setAttribute('mozallowfullscreen', '');
      frame.setAttribute(
        'referrerpolicy',
        'strict-origin-when-cross-origin'
      );

      /*
       * VideoSeeD запускается без sandbox.
       * Ограничения других источников оставляем без изменений.
       */
      if (name !== 'VideoSeeD') {
        frame.setAttribute(
          'sandbox',
          'allow-forms allow-scripts allow-same-origin allow-presentation allow-popups'
        );
      }

      stage.insertBefore(frame, state);
      hideState();
      footStatus.textContent = `Источник: ${name}`;
    }

    /*
     * Собственная кнопка полного экрана.
     * Разворачиваем область stage вместе с iframe.
     */
    fullscreenButton.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
          return;
        }

        if (stage.requestFullscreen) {
          await stage.requestFullscreen();
        } else if (stage.webkitRequestFullscreen) {
          stage.webkitRequestFullscreen();
        } else {
          footStatus.textContent =
            'Полноэкранный режим не поддерживается браузером';
        }
      } catch (error) {
        console.warn('[KinoDivBox] Fullscreen request failed:', error);
        footStatus.textContent =
          'Полный экран заблокирован браузером или родительской страницей';
      }
    });

    document.addEventListener('fullscreenchange', () => {
      fullscreenButton.textContent = document.fullscreenElement
        ? '⤢ Выйти из полного экрана'
        : '⛶ На весь экран';
    });

    function makeButton(provider, src = '', pending = false) {
      const button = document.createElement('button');
      button.className = 'switch-btn';
      button.type = 'button';
      button.textContent = pending ? `${provider.name}…` : provider.name;
      button.setAttribute('aria-pressed', 'false');
      button.disabled = pending || !src;

      if (src) {
        button.addEventListener('click', () => {
          showPlayer(src, provider.name, button);
        });
      }

      switcher.appendChild(button);
      return button;
    }

    async function buildPlayers(id) {
      const requestNumber = ++currentRequest;
      currentId = id;

      switcher.replaceChildren();
      switcher.hidden = true;
      clearPlayer();
      fullscreenButton.hidden = true;

      if (!id) {
        setState(
          'ⓘ',
          'Не указан ID фильма',
          'Добавьте ID Кинопоиска в адрес после ?id=. Например: /iframe?id=535341'
        );
        footStatus.textContent = 'Ожидается ID фильма';
        return;
      }

      setState(
        '…',
        'Загружаем источники',
        'Подготавливаем доступные варианты просмотра…'
      );
      footStatus.textContent = `ID Кинопоиска: ${id}`;

      const buttons = new Map();

      // Сначала создаём все кнопки в правильном порядке.
      for (const provider of providers) {
        if (provider.name === 'HDVB') {
          buttons.set(
            provider.name,
            makeButton(provider, '', true)
          );
          continue;
        }

        const src = safeHttpUrl(provider.resolve(id));
        const button = makeButton(provider, src);
        buttons.set(provider.name, button);
      }

      switcher.hidden = false;

      // Автоматически выбираем первый доступный источник.
      const firstButton = [...switcher.querySelectorAll('.switch-btn')]
        .find(button => !button.disabled);

      if (firstButton) {
        firstButton.click();
      }

      // HDVB загружается отдельно и всегда остаётся третьим.
      const hdvb = providers.find(provider => provider.name === 'HDVB');
      const hdvbButton = buttons.get('HDVB');

      try {
        const result = await hdvb.resolve(id);

        if (requestNumber !== currentRequest) return;

        const src = safeHttpUrl(result);

        if (src) {
          hdvbButton.disabled = false;
          hdvbButton.textContent = 'HDVB';

          hdvbButton.addEventListener('click', () => {
            showPlayer(src, 'HDVB', hdvbButton);
          });
        } else {
          hdvbButton.disabled = true;
          hdvbButton.textContent = 'HDVB недоступен';
          hdvbButton.title = 'Источник HDVB не найден';
        }
      } catch (error) {
        if (requestNumber !== currentRequest) return;

        hdvbButton.disabled = true;
        hdvbButton.textContent = 'HDVB недоступен';
      }

      if (requestNumber !== currentRequest) return;

      const available = [...switcher.querySelectorAll('.switch-btn')]
        .filter(button => !button.disabled);

      if (!available.length) {
        setState(
          '×',
          'Источники не найдены',
          'Не удалось подготовить источники для этого ID. Попробуйте позже или проверьте ID.',
          true
        );
        footStatus.textContent = 'Нет доступных источников';
      } else {
        footStatus.textContent = `Готово · ID ${id}`;
      }
    }

    retryButton.addEventListener('click', () => {
      buildPlayers(currentId || getIdFromUrl());
    });

    buildPlayers(getIdFromUrl());
  })();

  // Отключение контекстного меню и некоторых горячих клавиш.
  document.oncontextmenu = function() {
    return false;
  };

  document.onkeydown = function(e) {
    if (e.keyCode == 123) return false;
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
  };
  </script>

  <center>
    <!-- LiveInternet counter -->
    <a href="https://www.liveinternet.ru/click" target="_blank" rel="noopener noreferrer">
      <img id="licnt3652" width="88" height="15" style="border:0"
           title="LiveInternet: показано число посетителей за сегодня"
           src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAEALAAAAAABAAEAAAIBTAA7"
           alt="" />
    </a>
    <script>
      (function(d, s) {

          "https://counter.yadro.ru/hit?t26.6;r" + escape(d.referrer) +

    <!-- /LiveInternet -->
  </center>
</body>
</html>
